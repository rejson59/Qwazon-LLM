# Qwazon Tiny — ziemniak absolutny
# Działa na Raspberry Pi 4 (4GB), telefonie, Chromebooku
# 110M param, 18 warstw, brak MoE dla max prostoty
model:
  model_name: qwazon-tiny
  hidden_size: 768
  intermediate_size: 2048
  num_hidden_layers: 18
  num_attention_heads: 12
  num_key_value_heads: 4
  vocab_size: 32768
  max_position_embeddings: 16384
  rope_theta: 100000.0
  use_moe: false
  sliding_window: 2048

training:
  output_dir: checkpoints/qwazon-tiny
  max_seq_length: 2048
  learning_rate: 4.0e-4
  weight_decay: 0.1
  warmup_ratio: 0.05
  max_steps: 5000
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  bf16: false  # CPU training
  grad_clip: 1.0

data:
  mix:
    - {source: "starcoder-pl-code", weight: 0.4}
    - {source: "fineweb-pl", weight: 0.25}
    - {source: "fineweb-edu", weight: 0.2}
    - {source: "openwebmath", weight: 0.15}
