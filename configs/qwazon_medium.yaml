# Qwazon 1.2B — GŁÓWNY MODEL v0.1
# Złoty środek: 1.2B aktywne / 2.1B total (MoE)
# Działa na ziemniaku po Q4 (~1.1GB), inteligencją goni 7B
model:
  model_name: qwazon-1.2b
  hidden_size: 2048
  intermediate_size: 5632
  num_hidden_layers: 28
  num_attention_heads: 32
  num_key_value_heads: 8
  vocab_size: 49152
  max_position_embeddings: 32768
  rope_theta: 500000.0
  use_sliding_window: true
  sliding_window: 4096
  use_moe: true
  num_experts: 8
  num_experts_per_tok: 2
  moe_intermediate_size: 1408
  moe_every_n_layers: 2

training:
  output_dir: checkpoints/qwazon-1.2b
  max_seq_length: 4096  # curriculum: 2k -> 8k -> 32k
  learning_rate: 2.5e-4
  weight_decay: 0.1
  warmup_ratio: 0.03
  max_steps: 50000
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  bf16: true
  grad_clip: 1.0
  eval_steps: 500
  save_steps: 1000

# Data mix v0.1: 100B tokenów high-quality
data:
  total_tokens: 100B
  mix:
    - {name: "The Stack v2 (PL+Python+JS+Rust+Go)", weight: 0.35, tokens: 35B}
    - {name: "FineWeb-Edu PL filtered", weight: 0.20, tokens: 20B}
    - {name: "FineWeb-Edu EN STEM", weight: 0.15, tokens: 15B}
    - {name: "OpenCodeReasoning + Code Feedback", weight: 0.10, tokens: 10B}
    - {name: "Math: OrcaMath, GSM8K, MATH", weight: 0.10, tokens: 10B}
    - {name: "Polish: WolneLektury, WikiPL, PAP", weight: 0.10, tokens: 10B}
  curriculum:
    phase1: {steps: 30000, seq_len: 4096}
    phase2: {steps: 15000, seq_len: 8192, rope_scaling: {type: yarn, factor: 2}}
    phase3: {steps: 5000, seq_len: 32768, rope_scaling: {type: yarn, factor: 4}}

distillation:
  # Dwie fazy: najpierw uczeń naśladuje nauczyciela, potem RL
  use_distillation: true
  teachers: [Qwen2-72B-Instruct, DeepSeek-Coder-V2, Claude-3.5-Sonnet-logprobs]
  alpha: 0.5  # 0.5 cross-entropy na dane + 0.5 KL do nauczyciela
  temp: 2.0

rl:
  after_steps: 45000
  method: DPO
  data: ultrafeedback-pl-code
