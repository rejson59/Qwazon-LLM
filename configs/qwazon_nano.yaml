# Qwazon Nano — 30M ziemniak-wojownik
# Sweet spot dla treningu na CPU: uczy się prawdziwego kodowania w <30 min
model:
  model_name: qwazon-nano
  hidden_size: 512
  intermediate_size: 1376
  num_hidden_layers: 12
  num_attention_heads: 8
  num_key_value_heads: 4
  vocab_size: 8192
  max_position_embeddings: 4096
  rope_theta: 100000.0
  use_moe: false
  sliding_window: 1024

training:
  output_dir: checkpoints/qwazon-nano
  max_seq_length: 256
  learning_rate: 4.0e-4
  weight_decay: 0.1
  warmup_ratio: 0.05
  max_steps: 300
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  bf16: false
  eval_steps: 25
  save_steps: 75
  logging_steps: 10
  sample_steps: 50

data:
  mix:
    - {source: "synthetic-v2-pl-code", weight: 0.5}
    - {source: "starcoder-pl", weight: 0.3}
    - {source: "fineweb-pl", weight: 0.2}
