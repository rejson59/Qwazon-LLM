# Qwazon Small — sweet spot dla dewelopera
# 0.5B aktywne / 1.0B total MoE, 6GB RAM, CPU 18 tok/s
model:
  model_name: qwazon-small
  hidden_size: 1280
  intermediate_size: 3456
  num_hidden_layers: 24
  num_attention_heads: 20
  num_key_value_heads: 5
  vocab_size: 49152
  max_position_embeddings: 32768
  rope_theta: 500000.0
  use_moe: true
  num_experts: 8
  num_experts_per_tok: 2
  moe_intermediate_size: 896
  moe_every_n_layers: 2
  sliding_window: 4096

training:
  output_dir: checkpoints/qwazon-small
  max_seq_length: 4096
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_ratio: 0.03
  max_steps: 20000
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  bf16: true

distillation:
  use_distillation: true
  teacher_model: Qwen/Qwen2-7B-Instruct  # lub Claude API -> logprobs
  alpha: 0.6
  temp: 2.0
